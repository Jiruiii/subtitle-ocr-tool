[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-ocr-tool"
version = "0.1.0"
description = "Extract burned-in subtitles from videos with PaddleOCR."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jiruiii" }]
dependencies = [
    "opencv-python>=4.8",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
ocr = ["paddleocr[all]>=3.0,<4"]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
subtitle-ocr = "subtitle_ocr.cli:main"
subtitle-ocr-batch = "subtitle_ocr.batch_cli:main"
subtitle-ocr-wav = "subtitle_ocr.wav_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
